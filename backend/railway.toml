[build]
builder = "nixpacks"
buildCommand = "npm run prisma:generate && npm run build"

[deploy]
startCommand = "npm run db:setup && npm run start:prod"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
numReplicas = 2

[deploy.env]
NODE_ENV = "production"
PORT = "8080"
